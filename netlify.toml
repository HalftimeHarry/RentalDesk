[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "24"

# No [[redirects]] needed: @sveltejs/adapter-netlify (v7) registers its own
# `sveltekit-render` function via the Netlify Frameworks API (.netlify/v1/functions)
# with `path: "/*"` and `preferStatic: true`, so static assets are served first
# and every other request reaches the SvelteKit server.
